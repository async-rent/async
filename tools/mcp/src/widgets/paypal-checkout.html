<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayPal Checkout</title>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--bg-light);
        color: var(--text-light);
        min-height: 100vh;
        padding: 20px;
      }
      :root {
        --bg-light: #ffffff;
        --text-light: #1a1a1a;
      }
      :root.dark {
        --bg-light: #1e1e1e;
        --text-light: #f0f0f0;
      }
      .container {
        max-width: 460px;
        margin: 0 auto;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .header h1 {
        font-size: 1.5rem;
        margin-bottom: 4px;
      }
      .status {
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        text-align: center;
        font-weight: 500;
      }
      .status.paid {
        background: #dcfce7;
        color: #166534;
      }
      .status.awaiting {
        background: #fef3c7;
        color: #92400e;
      }
      .status.failed {
        background: #fee2e2;
        color: #991b1b;
      }
      .status.not-approved {
        background: #fee2e2;
        color: #991b1b;
      }
      .total {
        font-size: 1.3rem;
        text-align: center;
        margin: 20px 0;
        font-weight: 600;
        color: #00854b;
      }
      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn-primary {
        background: var(--primary, #00854b);
        color: #fff;
      }
      .btn-secondary {
        background: var(--secondary, #0070ba);
        color: #fff;
      }
      .btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .error {
        color: #991b1b;
        margin: 12px 0;
        text-align: center;
        display: none;
      }
      .details {
        text-align: center;
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 12px;
      }
      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        margin: 20px auto;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>PayPal Payment</h1>
      </div>

      <div id="status" class="status awaiting">Awaiting your approval...</div>

      <div class="total" id="total">$0.00</div>

      <div class="details" id="details"></div>

      <button id="payBtn" class="btn btn-primary" disabled>Pay with PayPal</button>
      <button id="approveBtn" class="btn btn-secondary" disabled>I've approved</button>

      <p id="error" class="error"></p>
    </div>

    <script>
      let orderId = "";
      let approvalUrl = "";
      let amount = 0;
      let currency = "USD";
      let sandbox = true;

      const statusEl = document.getElementById("status");
      const totalEl = document.getElementById("total");
      const errorEl = document.getElementById("error");
      const payBtn = document.getElementById("payBtn");
      const approveBtn = document.getElementById("approveBtn");

      // Listen for MCP widget data message from host
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "mcp_widget_data") {
          orderId = event.data.order_id;
          approvalUrl = event.data.approval_url;
          amount = event.data.amount || 0;
          currency = event.data.currency || "USD";
          sandbox = event.data.sandbox || true;
          totalEl.textContent = `$${new Intl.NumberFormat("en-US", { style: "currency", currency }).format(amount / 100)}`;
          updateUI("awaiting");
        }
      });

      function updateUI(state) {
        switch (state) {
          case "awaiting":
            statusEl.textContent = "Awaiting your approval...";
            statusEl.className = "status awaiting";
            payBtn.disabled = false;
            approveBtn.disabled = true;
            errorEl.style.display = "none";
            break;
          case "paid":
            statusEl.textContent = "Payment successful! Your rental is confirmed.";
            statusEl.className = "status paid";
            payBtn.disabled = true;
            approveBtn.disabled = true;
            errorEl.style.display = "none";
            break;
          case "not-approved":
            statusEl.textContent = "Payment not approved yet. Please complete the PayPal flow.";
            statusEl.className = "status not-approved";
            payBtn.disabled = false;
            approveBtn.disabled = false;
            errorEl.style.display = "none";
            break;
          case "failed":
            statusEl.textContent = "Payment failed. Please try again.";
            statusEl.className = "status failed";
            payBtn.disabled = false;
            approveBtn.disabled = false;
            errorEl.style.display = "block";
            break;
        }
      }

      function formatAmount(amt, curr) {
        return new Intl.NumberFormat("en-US", { style: "currency", currency }).format(amt / 100);
      }

      payBtn.addEventListener("click", () => {
        if (approvalUrl) {
          window.open(approvalUrl, "_blank", "width=600,height=700");
          updateUI("not-approved");
        }
      });

      approveBtn.addEventListener("click", async () => {
        approveBtn.disabled = true;
        approveBtn.textContent = "Checking...";
        try {
          // Call MCP confirm_payment tool
          const res = await fetch("/mcp/confirm_payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ order_id: orderId }),
          });
          const result = await res.json();
          if (result.status === "paid") {
            updateUI("paid");
          } else if (result.status === "failed") {
            updateUI("failed");
          } else {
            updateUI("not-approved");
          }
        } catch (err) {
          errorEl.textContent = "Error: " + err.message;
          errorEl.style.display = "block";
          updateUI("not-approved");
        }
      });

      // Also handle URL params fallback
      const params = new URLSearchParams(window.location.search);
      if (params.get("order_id") && params.get("approval_url")) {
        orderId = params.get("order_id");
        approvalUrl = params.get("approval_url");
        amount = parseFloat(params.get("amount") || "0");
        currency = params.get("currency") || "USD";
        totalEl.textContent = formatAmount(amount, currency);
        updateUI("awaiting");
      }
    </script>
  </body>
</html>
